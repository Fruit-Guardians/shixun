openapi: 3.1.0
info:
  title: 拾讯日报归档 API
  version: 3.6.0
  description: |
    Every response carries `Cache-Control: private, no-store` and `X-Content-Type-Options: nosniff`.
    Errors are always JSON `{ error: string, code?: string }` (see `Error`). Unknown paths return 404 and
    unsupported methods return 405 with an `Allow` header. 503 means storage is missing or temporarily
    unavailable and the request is safe to retry.

    Identity depends on `AUTH_PROVIDER`:
    - unset / `sites`: from the Sites ingress (`oai-authenticated-user-*` headers for signed-in visitors,
      `OAI-Sites-Authorization` for program sync). The API trusts these headers and does not re-verify them.
    - `cloudflare-access`: the site is public; reads need no identity. Only a JWT signed by Cloudflare Access
      counts (RS256, team issuer, application AUD, expiry), from the `Cf-Access-Jwt-Assertion` header on
      Access-protected paths (`/login`, `/api/sync*`) or from the `CF_Authorization` cookie elsewhere. A user JWT
      carries the email; a service-token JWT (no email, header only) is the only way to call `/api/sync*`, still
      with `X-Sites-Report-Sync`. Plain identity headers are ignored. Imports and owner actions require a
      same-origin browser request from an email in `OWNER_EMAILS`; signed-out writes get 401 with a hint to
      visit `/login`. In this mode the Worker also adds site-wide security headers (CSP, HSTS, `X-Frame-Options`,
      `Referrer-Policy`, `Permissions-Policy`) to every response.
paths:
  /api/health:
    get:
      summary: Liveness and whether the D1 binding is present (no secrets or data exposed)
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/reports:
    get:
      summary: List archived reports (seeds merged with stored reports, newest first)
      description: |
        Since 3.0.0 the list carries metadata and per-story summaries only: no `raw` Markdown and no story
        `body`. Fetch the full text with `GET /api/reports/{id}` and search bodies with `GET /api/search`.
      responses:
        '200':
          description: Reports, Drive import status and the actual program-sync heartbeat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportsResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      summary: Import Markdown as a signed-in visitor, or as a server holding INGEST_TOKEN
      description: |
        Browsers must send a matching `Origin`. Callers without `Origin` are treated as server-side and must
        present a platform identity or `Authorization: Bearer <INGEST_TOKEN>`. Under Cloudflare Access only the
        owner may import from the page (same-origin required; 403 `not_owner` for other signed-in emails).
      security:
        - {}
        - ingestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRequest'}
      responses:
        '200':
          description: Created, updated, or unchanged with readback verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/reports/{id}:
    get:
      summary: Download exact original Markdown
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Original Markdown as an attachment
          content:
            text/markdown: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      summary: Owner removes a stored report; its current text is kept in version history
      description: |
        Signed-in owner (`OWNER_EMAILS` when configured) on the exact same `Origin`. Removes the report and its
        stories; a legacy seed for the same date and topic becomes visible again. A Drive-synced report comes
        back when its source file changes.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteReportResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'Origin mismatch, or not an owner (code: not_owner)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'Seeds shipped with the site cannot be deleted (code: seed_report)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/reports/{id}/versions:
    get:
      summary: Current revision and replaced versions (metadata only, newest first, at most 50)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Version history; seeds have none
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportVersionsResponse'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/reports/{id}/versions/{versionId}:
    get:
      summary: Download one replaced version verbatim
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: versionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Markdown as an attachment
          content:
            text/markdown: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/reports/{id}/versions/{versionId}/restore:
    post:
      summary: Owner restores a replaced version as a new revision
      description: |
        Same owner and `Origin` rules as DELETE. The current text is archived like any update, so nothing is
        lost. Restoring text identical to the current one returns `unchanged`.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: versionId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Written and read back
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'Origin mismatch, or not an owner (code: not_owner)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/session:
    get:
      summary: Who is visiting (UI hint only)
      description: |
        Added in 3.5.0. Tells the web client whether to show owner controls (import, restore, delete, sync setup).
        It is a display hint, not an authorization: every write endpoint still checks identity itself.
        Service-token JWTs and plain identity headers (in Access mode) never count as signed in.
      responses:
        '200':
          description: The visitor's identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
  /api/search:
    get:
      summary: Search every story's title and body
      description: |
        Case-insensitive literal substring match (no tokenisation, `%` and `_` are not wildcards) across all
        visible reports, seeds included. A blank query returns no ids.
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Ids of matching stories (no ranking; the client orders them with the list)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        '400': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/feed:
    get:
      summary: Feed items fetched from public sources, newest first
      description: |
        Added in 3.6.0. A Workers cron runs every 5 minutes and fetches the four most overdue channels, each on its
        own interval (communities, GitHub Trending and releases, papers and trending models, AI labs, engineering and platform blogs,
        newsletters, Chinese sources, security news and advisories, security research blogs, CISA KEV,
        NVD, GitHub Advisory and OSV; `GET /api/feed/channels` lists them all). Items published before the 30-day
        retention window are not stored. No model is involved: titles and summaries are the sources' own text with HTML stripped, and links are
        http(s) only. Items are kept for 30 days by publish time. GitHub Trending has no publish time, so
        `publishedAt` is when the repository was first seen on the page.
      parameters:
        - {in: query, name: source, required: false, schema: {$ref: '#/components/schemas/FeedSource'}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: cursor, required: false, description: '`nextCursor` from the previous page', schema: {type: string}}
      responses:
        '200':
          description: One page of items and the status of every channel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedResponse'}
        '400': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/feed/channels:
    get:
      summary: Every feed channel with its description, homepage, interval and latest run
      description: |
        Added in 3.6.0. Public. Backs the sources page. Channels are listed in display order; `group` is the section
        they belong to. `latestAt` is the newest publish time seen in the latest successful fetch, including items
        too old to be stored, so rarely updated blogs still show when they last posted.
      responses:
        '200':
          description: All channels
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedChannelsResponse'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/feed/refresh:
    post:
      summary: Fetch channels now (owner or INGEST_TOKEN)
      description: |
        Added in 3.6.0. Fetches one channel (`{"channel": "<id>"}`) or, with an empty body, the stalest channels in turn
        until the per-request subrequest budget is used up (the rest are left to the cron).
        The response lists only the channels fetched by this call.
        Same identity rules as `POST /api/reports`: a bearer `INGEST_TOKEN`, or in Access mode a same-origin
        request from an owner. Failures are recorded per channel and returned, not raised.
      security: [{ingestToken: []}, {}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: {type: string, description: 'Channel id, e.g. `hackernews`, `kev`, `osv-pypi`, `rss-lwn`'}
      responses:
        '200':
          description: Status of each fetched channel
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: {type: array, items: {$ref: '#/components/schemas/FeedChannelStatus'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/sync:
    post:
      summary: Drive ingestion, exclusively behind owner-private Sites service access
      description: |
        Requires `OAI-Sites-Authorization` at Sites ingress and `X-Sites-Report-Sync: google-apps-script`,
        with no `Origin` or `Sec-Fetch-Site` header. Not a public endpoint.
      parameters:
        - {in: header, name: X-Sites-Report-Sync, required: true, schema: {type: string, enum: [google-apps-script]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ImportRequest'}
                - {type: object, required: [sourceFileId]}
      responses:
        '200':
          description: Exact content readback verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResult'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Error'}
        '410': {description: 'Legacy google-drive AI sync protocol retired (code: legacy_ai_sync_retired)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/sync/status:
    get:
      summary: Read actual Apps Script heartbeat; empty means awaiting_setup
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncState'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      summary: Record Google runtime trigger state, run counters and failed files behind private ingress
      description: |
        Each write also deletes receipts older than 30 days. `failures` lists at most 10 failed files; names
        and reasons longer than 200 / 300 characters are truncated. More failures than `failed` is rejected.
      parameters:
        - {in: header, name: X-Sites-Report-Sync, required: true, schema: {type: string, enum: [google-apps-script]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncRunInput'}
      responses:
        '200':
          description: Recorded state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncState'}
        '400': {$ref: '#/components/responses/Invalid'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {description: State body larger than 16384 bytes, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/integration/setup-credential:
    post:
      summary: Explicit owner setup action to copy private service credential
      description: |
        Signed-in visitor on the owner-private Site, exact same `Origin`. When `OWNER_EMAILS` is configured,
        only those accounts (case-insensitive) may read the credential. Never include the token in static
        assets or logs.
      responses:
        '200':
          description: Runtime service token for Google Script Properties only
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'Origin mismatch, or signed in but not an owner (code: not_owner)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'Cloudflare Access deployment: the script uses an Access service token instead (code: access_service_token)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Runtime credential not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    ingestToken: {type: http, scheme: bearer, description: Optional INGEST_TOKEN for server-side imports}
  responses:
    Error:
      description: Request rejected
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Malformed JSON or failed validation; `error` is safe to show to users
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Storage missing or temporarily unavailable; safe to retry
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        code: {type: string}
    Health:
      type: object
      required: [ok, database]
      properties:
        ok: {type: boolean, const: true}
        database: {type: boolean}
    Session:
      type: object
      required: [signedIn, owner, email, loginPath, logoutPath]
      properties:
        signedIn: {type: boolean}
        owner: {type: boolean, description: May import, delete, restore versions and see sync failure details}
        email: {type: [string, 'null'], description: The signed-in visitor's own email}
        loginPath: {type: [string, 'null'], description: '`/login` in Access mode; null when the platform handles sign-in'}
        logoutPath: {type: [string, 'null'], description: Access logout URL when signed in; otherwise null}
    Topic:
      type: string
      enum: [全球技术社区, 安全专题]
    ImportRequest:
      type: object
      required: [raw, date]
      properties:
        raw: {type: string, description: 'Complete unchanged UTF-8 Markdown, at least 100 characters and at most 500 000 bytes'}
        date: {type: string, format: date}
        topic: {allOf: [{$ref: '#/components/schemas/Topic'}], description: Defaults to 全球技术社区 when omitted; other values are rejected}
        sourceFileId: {type: string, pattern: '^[A-Za-z0-9_-]{10,150}$'}
    IngestResult:
      type: object
      required: [id, status, hash, revision]
      properties:
        id: {type: string}
        status: {type: string, enum: [created, updated, unchanged]}
        hash: {type: string, description: SHA-256 hex of raw}
        revision: {type: integer, minimum: 1, description: Incremented in the database, so concurrent writers never share one}
    ReportVersion:
      type: object
      required: [id, hash, savedAt, chars]
      properties:
        id: {type: string}
        hash: {type: string}
        savedAt: {type: string, format: date-time, description: When this text was replaced or deleted}
        chars: {type: integer, minimum: 0, description: Unicode code points}
    ReportVersionsResponse:
      type: object
      required: [reportId, stored, current, versions, truncated]
      properties:
        reportId: {type: string}
        stored: {type: boolean, description: False for seeds shipped with the site, which have no history and cannot be deleted}
        current:
          type: object
          required: [revision, hash, importedAt, chars]
          properties:
            revision: {type: integer, minimum: 1}
            hash: {type: string}
            importedAt: {type: [string, 'null'], format: date-time}
            chars: {type: integer, minimum: 0}
        versions: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ReportVersion'}}
        truncated: {type: boolean, description: Older versions exist beyond the listed ones}
    DeleteReportResponse:
      type: object
      required: [id, deleted]
      properties:
        id: {type: string}
        deleted: {type: boolean, const: true}
    Tag:
      type: string
      description: Category label assigned by the shared parser
    StorySummary:
      type: object
      required: [id, reportId, index, date, topic, title, summary, tags]
      properties:
        id: {type: string, description: '`${reportId}--${index}`'}
        reportId: {type: string}
        index: {type: integer, minimum: 0}
        date: {type: string, format: date}
        topic: {$ref: '#/components/schemas/Topic'}
        title: {type: string}
        summary: {type: string}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
    ReportSummary:
      description: A report without its raw Markdown, plus derived counts and story summaries
      type: object
      required: [id, date, title, topic, source, sourceFileId, importedAt, chars, links, stories]
      properties:
        id: {type: string}
        date: {type: string, format: date}
        title: {type: string}
        topic: {$ref: '#/components/schemas/Topic'}
        source: {type: string}
        sourceFileId: {type: [string, 'null']}
        importedAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer}
        chars: {type: integer, minimum: 0, description: Length of the raw Markdown in UTF-16 code units}
        links: {type: integer, minimum: 0}
        stories: {type: array, items: {$ref: '#/components/schemas/StorySummary'}}
    SearchResponse:
      type: object
      required: [query, storyIds]
      properties:
        query: {type: string, description: The trimmed query that was matched}
        storyIds: {type: array, items: {type: string}}
    SyncRunInput:
      type: object
      required: [triggerInstalled]
      properties:
        triggerInstalled: {type: boolean}
        checkedAt: {type: string, format: date-time}
        created: {type: integer, minimum: 0, maximum: 10000}
        updated: {type: integer, minimum: 0, maximum: 10000}
        unchanged: {type: integer, minimum: 0, maximum: 10000}
        failed: {type: integer, minimum: 0, maximum: 10000}
        failures: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/SyncFailure'}}
    SyncFailure:
      type: object
      required: [fileId, name, reason]
      properties:
        fileId: {type: string, pattern: '^[A-Za-z0-9_-]{10,150}$', description: Google Drive file id}
        name: {type: string, maxLength: 200}
        reason: {type: string, maxLength: 300, description: Human-readable, safe to display}
    SyncState:
      type: object
      required: [mode, state, lastCheckedAt, triggerInstalled, created, updated, unchanged, failed, failures, legacyWriterDisabled]
      properties:
        mode: {type: string, const: google-apps-script}
        state: {type: string, enum: [awaiting_setup, active, stale, attention, disabled]}
        lastCheckedAt: {type: [string, 'null'], format: date-time}
        triggerInstalled: {type: boolean}
        created: {type: integer}
        updated: {type: integer}
        unchanged: {type: integer}
        failed: {type: integer}
        failures: {type: array, items: {$ref: '#/components/schemas/SyncFailure'}, description: 'Failed files from the latest receipt; empty for older scripts. Since 3.5.0, in Access mode only the owner sees them (visitors get an empty list; `failed` still counts them).'}
        legacyWriterDisabled: {type: boolean, const: true}
    ReportsResponse:
      type: object
      required: [reports, sync, drive]
      properties:
        reports: {type: array, items: {$ref: '#/components/schemas/ReportSummary'}}
        sync: {$ref: '#/components/schemas/SyncState'}
        drive:
          type: object
          required: [status, folderId]
          properties:
            status: {type: string, enum: [imported, not_connected]}
            folderId: {type: string}
    FeedSource:
      type: string
      enum: [hackernews, lobsters, v2ex, github, releases, papers, ai, engineering, rss, zh, secnews, security, kev, nvd, ghsa, osv]
    FeedGroup:
      type: string
      description: Section on the sources page; `sec-*` groups are security research blogs by topic
      enum: [community, github, papers, ai, blogs, engineering, platforms, weekly, zh, vulns, sec-news, sec-web, sec-binary, sec-windows, sec-cloud, sec-threat, sec-mobile, sec-supply, sec-crypto, sec-ai, sec-archive]
    FeedItem:
      type: object
      required: [id, source, channel, channelName, title, url, discussionUrl, summary, author, score, severity, tags, publishedAt]
      properties:
        id: {type: string, description: '`<channel>:<id within the source>`'}
        source: {$ref: '#/components/schemas/FeedSource'}
        channel: {type: string}
        channelName: {type: string}
        title: {type: string}
        url: {type: string, format: uri, description: http(s) only}
        discussionUrl: {type: [string, 'null'], description: Hacker News comments page}
        summary: {type: string, description: Plain text, may be empty}
        author: {type: [string, 'null']}
        score: {type: [integer, 'null'], description: Hacker News points or GitHub stars gained today}
        severity: {type: [string, 'null'], enum: [critical, high, medium, low, null]}
        tags: {type: array, items: {type: string}, description: 'Language, total stars, CVE id, CVSS score, affected packages'}
        publishedAt: {type: string, format: date-time}
    FeedChannelStatus:
      type: object
      required: [id, source, group, name, description, homepage, everyMinutes, lastRunAt, ok, fetched, error, latestAt]
      properties:
        id: {type: string}
        source: {$ref: '#/components/schemas/FeedSource'}
        group: {$ref: '#/components/schemas/FeedGroup'}
        name: {type: string}
        description: {type: string, description: One-sentence introduction (Chinese)}
        homepage: {type: string, format: uri}
        everyMinutes: {type: integer, description: Minimum minutes between two fetches}
        lastRunAt: {type: [string, 'null'], format: date-time, description: Null until the first fetch}
        ok: {type: boolean}
        fetched: {type: integer, description: Items parsed by the latest fetch}
        error: {type: [string, 'null'], description: 'Status code, timeout or "nothing parsed"; never response content'}
        latestAt: {type: [string, 'null'], format: date-time, description: 'Newest publish time seen; kept when a later fetch fails or is empty'}
    FeedChannelsResponse:
      type: object
      required: [channels]
      properties:
        channels: {type: array, items: {$ref: '#/components/schemas/FeedChannelStatus'}}
    FeedResponse:
      type: object
      required: [items, channels, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FeedItem'}}
        channels: {type: array, items: {$ref: '#/components/schemas/FeedChannelStatus'}}
        nextCursor: {type: [string, 'null']}
