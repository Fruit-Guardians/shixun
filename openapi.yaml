openapi: 3.1.0
info:
  title: 拾讯日报归档 API
  version: 2.1.0
  description: |
    Errors are always JSON `{ error: string, code?: string }`. Unknown paths return 404 and unsupported methods return 405 with an `Allow` header.
    Unexpected write failures on `/api/sync` now return 503 (previously 400) so Apps Script retries instead of treating them as permanent validation errors.
paths:
  /api/health:
    get:
      summary: Liveness and whether the D1 binding is present (no secrets or data exposed)
      responses:
        '200': {description: '{ ok: true, database: boolean }'}
  /api/reports:
    get:
      summary: Read archived reports behind private Site access
      responses:
        '200': {description: Reports, import status and actual program-sync heartbeat state}
        '503': {description: Storage temporarily unavailable}
    post:
      summary: Import Markdown as a signed-in visitor
      responses:
        '200': {description: Created, updated, or unchanged with readback verified}
        '400': {description: Invalid content or date}
        '401': {description: Sign-in required}
        '403': {description: Origin mismatch}
        '413': {description: File too large}
  /api/sync:
    post:
      summary: Drive ingestion, exclusively behind owner-private Sites service access
      description: Requires OAI-Sites-Authorization at Sites ingress and X-Sites-Report-Sync google-apps-script. Not a public endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw, date, sourceFileId]
              properties:
                raw: {type: string, description: Complete unchanged UTF-8 Markdown}
                date: {type: string, format: date}
                sourceFileId: {type: string}
                topic: {type: string, enum: [全球技术社区, 安全专题]}
      responses:
        '200': {description: Exact content readback verified, includes id, hash, status, revision}
        '400': {description: Validation failed}
        '403': {description: Browser or invalid protocol request rejected}
        '410': {description: Legacy google-drive AI sync protocol retired}
        '413': {description: File too large}
        '503': {description: Storage temporarily unavailable; safe to retry}
  /api/sync/status:
    get:
      summary: Read actual Apps Script heartbeat; empty means awaiting_setup
      responses:
        '200': {description: mode, state, lastCheckedAt, triggerInstalled and run counters}
        '503': {description: State storage temporarily unavailable}
    post:
      summary: Record Google runtime trigger state and run counters behind private ingress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [triggerInstalled]
              properties:
                triggerInstalled: {type: boolean}
                checkedAt: {type: string, format: date-time}
                created: {type: integer, minimum: 0, maximum: 10000}
                updated: {type: integer, minimum: 0, maximum: 10000}
                unchanged: {type: integer, minimum: 0, maximum: 10000}
                failed: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '200': {description: Recorded state}
        '400': {description: Invalid state}
        '403': {description: Browser or invalid protocol rejected}
        '413': {description: State body too large}
  /api/integration/setup-credential:
    post:
      summary: Explicit owner setup action to copy private service credential
      description: Signed-in owner on owner-private Site, exact same Origin. Never cached. Never include token in static assets or logs.
      responses:
        '200': {description: Runtime service token for Google Script Properties only}
        '401': {description: Sign-in required}
        '403': {description: Origin mismatch}
        '503': {description: Runtime credential not configured}
  /api/reports/{id}:
    get:
      summary: Download exact original Markdown
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: Original Markdown with download headers}
        '404': {description: Report not found}
